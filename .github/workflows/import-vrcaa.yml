# One-time foundation import. Removed from the resulting tree by this job.
name: Import VRCAA foundation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-vrcaa.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nateorbit-foundation-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'c0destep/nateorbit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Import pinned source and preserve both histories
        shell: bash
        run: |
          set -euo pipefail
          source_sha=eb3978247d969e2c593837175fc7598e95f51b35
          seed_sha=$(git rev-parse HEAD)
          git fetch --no-tags https://github.com/Nyabsi/VRCAA.git "$source_sha"
          test "$(git rev-parse FETCH_HEAD)" = "$source_sha"
          if git merge-base --is-ancestor "$source_sha" HEAD; then
            echo 'Foundation is already imported; refusing a second import.' >&2
            exit 1
          fi
          git archive --format=tar --output="$RUNNER_TEMP/nateorbit-overlay.tar" "$seed_sha"
          git read-tree --reset -u "$source_sha"
          tar -xf "$RUNNER_TEMP/nateorbit-overlay.tar" -C .
          rm -f .github/workflows/nightly.yml .github/workflows/import-vrcaa.yml
          python3 scripts/verify_bootstrap.py
          python3 scripts/verify_codex.py
          python3 -m unittest discover -s scripts/tests -v
          git add --all
          tree_sha=$(git write-tree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          import_sha=$(printf '%s\n' 'chore: import pinned VRCAA foundation with Codex and Linux setup' | git commit-tree "$tree_sha" -p "$seed_sha" -p "$source_sha")
          git merge-base --is-ancestor "$source_sha" "$import_sha"
          # Fast-forward only. A concurrent main update aborts this push.
          git push origin "$import_sha:refs/heads/main"
          git checkout --detach "$import_sha"
          echo "Imported source at $import_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify imported Android project
        run: bash scripts/check.sh --stacktrace
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-check-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/
            app/build/test-results/
